<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd09b"/><stop offset=".55" stop-color="#f18a61"/><stop offset="1" stop-color="#a9434b"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17131d" stop-opacity=".9"/><stop offset="1" stop-color="#090b12" stop-opacity=".78"/></linearGradient>
</defs>
<!-- Transparent canvas: add this as an image source above gameplay in OBS. -->
<!-- brand plaque -->
<path d="M48 48h390v8H56v116h-8z" fill="url(#accent)" filter="url(#glow)"/>
