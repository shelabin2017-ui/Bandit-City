name: Python syntax check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: |
          python -m py_compile bot.py db.py game.py v5/__init__.py v5/bridge.py v5/extras.py
