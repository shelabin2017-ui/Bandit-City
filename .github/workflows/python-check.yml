name: Python syntax check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: |
          python -m py_compile bot.py db.py game.py v5/__init__.py v5/bridge.py v5/extras.py
      - name: Build repository ZIP
        run: |
          rm -rf "$RUNNER_TEMP/bandit-package" Bandit-City.zip
          mkdir -p "$RUNNER_TEMP/bandit-package/Bandit-City"
          rsync -a --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' ./ "$RUNNER_TEMP/bandit-package/Bandit-City/"
          cd "$RUNNER_TEMP/bandit-package"
          zip -qr "$GITHUB_WORKSPACE/Bandit-City.zip" Bandit-City
      - name: Upload repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Bandit-City-Final
          path: Bandit-City.zip
          if-no-files-found: error
