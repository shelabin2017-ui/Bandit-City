name: Bandit City tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run root regression tests
        run: python -m unittest discover -v
      - name: Run tests package
        run: python -m unittest discover -s tests -v
      - name: Package deployable source ZIP
        run: >-
          zip -r bandit-city-release.zip .
          -x ".git/*" ".github/*" ".env" "bandit.db" "*.db"
          "*/__pycache__/*" "__pycache__/*" ".venv/*" "venv/*"
          "bandit-city-release.zip" "test_*.py" "tests/*"
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-city-release
          path: bandit-city-release.zip
          if-no-files-found: error
          retention-days: 30
