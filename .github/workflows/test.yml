name: Bandit City tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run root regression tests
        run: python -m unittest discover -v
      - name: Run tests package
        run: python -m unittest discover -s tests -v
      - name: Run release self-test
        run: python selftest.py
      - name: Build clean runtime ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".").resolve()
          output = Path("/tmp/bandit-city-release.zip")
          excluded_dirs = {".git", ".github", ".venv", "venv", "__pycache__", "tests"}
          excluded_suffixes = {".db", ".sqlite", ".sqlite3", ".pyc", ".zip"}
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root)
                  if any(part in excluded_dirs for part in rel.parts):
                      continue
                  if rel.name == ".env" or rel.suffix.lower() in excluded_suffixes:
                      continue
                  if rel.name.startswith("test_") or rel.name.endswith("_test.py"):
                      continue
                  archive.write(path, rel.as_posix())
          with ZipFile(output) as archive:
              names = archive.namelist()
              if not names or "bot.py" not in names or "db.py" not in names:
                  raise SystemExit("Runtime ZIP is missing required source files")
              forbidden = [
                  name for name in names
                  if name == ".env" or name.endswith((".db", ".sqlite", ".sqlite3", ".pyc"))
                  or any(part in excluded_dirs for part in Path(name).parts)
                  or Path(name).name.startswith("test_")
              ]
              if forbidden:
                  raise SystemExit(f"Forbidden paths in runtime ZIP: {forbidden}")
              print(f"Runtime ZIP validated: {len(names)} files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-city-release
          path: /tmp/bandit-city-release.zip
          if-no-files-found: error
          retention-days: 30
